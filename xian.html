<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="健体修仙录" />
<title>健体修仙录</title>
<style>
/* ============================================================
   健体修仙录 · 独立页样式（核心逻辑在 xian-core.js）
   © 2026 Acffx · 原创 · 保留所有权利
   ============================================================ */
:root{
  --bg:#0b1120;--card:#131c31;--card2:#1a2540;--line:#26314d;
  --text:#e2e8f0;--muted:#8fa3bf;--gold:#fbbf24;--pink:#ec4899;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --dao:#7cf0a9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100vw;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(80px + var(--safe-b));}
button{font-family:inherit;cursor:pointer;}

/* 顶栏 */
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0b1120 60%,rgba(11,17,32,.92));
  padding:calc(var(--safe-t) + 12px) 16px 10px;backdrop-filter:blur(8px);}
.topbar-title{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800;letter-spacing:1px;}
.topbar-title .back{width:32px;height:32px;border-radius:50%;background:#1a2540;border:0;color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center;}
/* 底部同步栏 */
.footer-bar{position:fixed;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;z-index:30;
  background:rgba(11,17,32,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:10px 12px calc(10px + var(--safe-b));}
.footer-bar .btn{width:100%;border:0;border-radius:12px;padding:13px;font-size:14px;font-weight:700;
  background:linear-gradient(90deg,#2563eb,#7c3aed);color:#fff;}

/* Toast / 特效 / 弹窗（供 core 使用） */
#toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translateX(-50%);
  z-index:999;background:rgba(17,24,39,.95);color:#fff;padding:11px 20px;border-radius:22px;
  font-size:13px;font-weight:500;max-width:84vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4);
  transition:opacity .25s;pointer-events:none;}
#toast.hidden{opacity:0;}
.fx-layer{position:fixed;inset:0;z-index:900;pointer-events:none;overflow:hidden;}
.fx-shade{position:fixed;inset:0;z-index:800;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;}
.fx-shade .fx-card{background:#131c31;border:1px solid #fbbf24;border-radius:18px;padding:26px 22px;text-align:center;max-width:82vw;}
.fx-shade .fx-t1{font-size:22px;font-weight:800;color:#fbbf24;margin-bottom:8px;}
.fx-shade .fx-t2{font-size:14px;color:var(--text);margin-bottom:6px;}
.fx-shade .fx-t3{font-size:12px;color:var(--muted);}
.break-ring{position:fixed;left:50%;top:45%;width:60vmin;height:60vmin;transform:translate(-50%,-50%);
  border:3px solid #fbbf24;border-radius:50%;z-index:910;pointer-events:none;opacity:0;}
.break-ring.show{animation:ringExpand 1.6s ease-out forwards;}
@keyframes ringExpand{0%{width:10vmin;height:10vmin;opacity:1}100%{width:80vmin;height:80vmin;opacity:0}}
.bottleneck-shade{position:fixed;inset:0;z-index:880;background:rgba(80,80,90,.28);display:flex;align-items:center;justify-content:center;}
.bottleneck-shade .bn-card{background:#1a2030;border:1px solid #4b5563;border-radius:18px;padding:26px 22px;text-align:center;max-width:84vw;}
.bn-t1{font-size:20px;font-weight:800;color:#9ca3af;margin-bottom:10px;}
.bn-t2{font-size:13px;color:#cbd5e1;line-height:1.7;text-align:left;}
.particle{position:absolute;border-radius:50%;pointer-events:none;animation:floatUp linear forwards;}
@keyframes floatUp{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-120px);opacity:0}}
.no-fx .particle,.no-fx .fx-layer,.no-fx .break-ring{display:none !important;}
.modal{position:fixed;inset:0;z-index:800;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;}
.modal-card{background:var(--card);border-radius:20px 20px 0 0;padding:20px 18px calc(24px + var(--safe-b));max-width:430px;width:100%;max-height:75vh;overflow-y:auto;}
.modal-card h3{margin:0 0 12px;font-size:17px;}
.form-field{margin-bottom:12px;}
.form-field label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px;}
.form-field input{width:100%;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:10px;padding:11px;font-size:15px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-actions{display:flex;gap:10px;margin-top:8px;}
.form-actions .btn{flex:1;}
.btn{border:0;border-radius:12px;padding:12px;font-size:14px;font-weight:700;}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line);}
.btn.primary{background:linear-gradient(90deg,#2563eb,#7c3aed);color:#fff;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="topbar-title">
      <button class="back" id="btnBack">‹</button>
      <span>🏯 健体修仙录</span>
    </div>
  </div>
  <div id="view"></div>
</div>
<div class="footer-bar"><button class="btn" id="btnSync">🔄 同步训练修为</button></div>
<div id="toast" class="hidden"></div>
<script src="xian-core.js"></script>
<script>
(function(){
  var app = document.getElementById('app');
  var view = document.getElementById('view');
  document.getElementById('btnBack').addEventListener('click', function(){
    history.length > 1 ? history.back() : location.href = './index.html';
  });
  document.getElementById('btnSync').addEventListener('click', function(){
    XianCore.syncAll(view);
  });
  XianCore.init();
  XianCore.renderTo(view);
})();
</script>
</body>
</html>

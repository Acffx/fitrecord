<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<title>健体修仙录</title>
<style>
/* ============================================================
   FitRecord · 健体修仙录（独立页面）
   严格遵循《健体修仙小游戏·全套完整系统》文档
   © 2026 Acffx · 原创 · 保留所有权利
   ============================================================ */
:root{
  --bg:#0b1120;--card:#131c31;--card2:#1a2540;--line:#26314d;
  --text:#e2e8f0;--muted:#8fa3bf;--gold:#fbbf24;--pink:#ec4899;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --dao:#7cf0a9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100vw;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(90px + var(--safe-b));}
button{font-family:inherit;cursor:pointer;}

/* 顶部状态栏 */
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0b1120 60%,rgba(11,17,32,.92));
  padding:calc(var(--safe-t) + 12px) 16px 10px;backdrop-filter:blur(8px);}
.topbar-title{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800;letter-spacing:1px;}
.topbar-title .back{width:32px;height:32px;border-radius:50%;background:#1a2540;border:0;color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center;}
.realm-strip{display:flex;align-items:center;gap:10px;margin-top:10px;}
.realm-ic{font-size:30px;line-height:1;filter:drop-shadow(0 0 8px var(--dao));}
.realm-info{flex:1;min-width:0;}
.realm-name{font-size:17px;font-weight:800;color:var(--dao);}
.realm-sub{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;}
.realm-prog{height:8px;background:#1a2540;border-radius:8px;margin-top:8px;overflow:hidden;}
.realm-prog-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--dao),#a78bfa);transition:width .4s;}
.realm-prog-txt{font-size:10px;color:var(--muted);margin-top:4px;text-align:right;font-variant-numeric:tabular-nums;}
/* 灵根条 */
.root-strip{display:flex;align-items:center;gap:8px;margin-top:8px;background:var(--card);border-radius:12px;padding:8px 12px;}
.root-badge{font-size:13px;font-weight:800;padding:3px 10px;border-radius:20px;white-space:nowrap;}
.root-ffmi{font-size:12px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums;}
.debuff-tag{font-size:11px;color:#f59e0b;margin-left:8px;}

/* 区块标题 */
.sec-title{display:flex;align-items:baseline;gap:8px;font-size:15px;font-weight:800;margin:16px 12px 10px;}
.sec-title .sub{font-size:11px;color:var(--muted);font-weight:400;}

/* 功法三卡 */
.dao-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 12px;}
.dao-card{border-radius:14px;padding:10px;background:var(--card);border:1px solid var(--line);text-align:center;}
.dao-card.active{border-color:var(--dao);box-shadow:0 0 10px var(--dao)33;}
.dao-card .dc-name{font-size:13px;font-weight:800;margin-bottom:4px;}
.dao-card .dc-ic{font-size:22px;margin-bottom:4px;}
.dao-card .dc-val{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;}

/* 功法列表 */
.skills-wrap{padding:0 12px;}
.skill-card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid var(--line);}
.skill-head{display:flex;align-items:center;gap:10px;}
.skill-ic{width:38px;height:38px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto;position:relative;}
.skill-ic .lv-badge{position:absolute;bottom:-4px;right:-4px;background:var(--gold);color:#111;font-size:9px;font-weight:800;border-radius:8px;padding:0 4px;}
.skill-info{flex:1;min-width:0;}
.skill-name{font-size:14px;font-weight:800;}
.skill-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.skill-exp{height:5px;background:var(--card2);border-radius:4px;margin-top:6px;overflow:hidden;}
.skill-exp-fill{height:100%;border-radius:4px;background:var(--dao);transition:width .4s;}
.skill-exp-txt{font-size:10px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;}
.main-btn{flex:0 0 auto;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:10px;padding:6px 10px;font-size:11px;}
.main-btn.on{background:linear-gradient(90deg,#f59e0b,#fbbf24);color:#111;border-color:transparent;font-weight:700;}
.skill-effect{font-size:10px;color:#7f9cbd;margin-top:6px;font-style:italic;}

/* 肉身档案 */
.body-card{background:var(--card);border-radius:14px;padding:12px;margin:0 12px;}
.body-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.bd-cell{background:var(--card2);border-radius:10px;padding:8px;text-align:center;}
.bd-cell .k{font-size:10px;color:var(--muted);}
.bd-cell .n{font-size:15px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;}
.bd-cell .u{font-size:10px;color:var(--muted);font-weight:400;}
.body-edit{margin-top:10px;width:100%;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:10px;padding:9px;font-size:13px;}
.body-edit:active{opacity:.8;}

/* 底部操作栏 */
.footer-bar{position:fixed;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;z-index:30;
  background:rgba(11,17,32,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:10px 12px calc(10px + var(--safe-b));}
.footer-row{display:flex;gap:8px;}
.btn{flex:1;border:0;border-radius:12px;padding:12px;font-size:14px;font-weight:700;}
.btn.primary{background:linear-gradient(90deg,#2563eb,#7c3aed);color:#fff;}
.btn.gold{background:linear-gradient(90deg,#f59e0b,#ef4444);color:#fff;}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line);}
.btn:disabled{opacity:.5;}
.btn-locked{opacity:.55;pointer-events:none;transform:scale(.98);}
.footer-sub{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--muted);}
select{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;}
.switch-row{display:flex;align-items:center;gap:8px;}
.switch{position:relative;width:44px;height:24px;flex:0 0 auto;}
.switch input{opacity:0;width:0;height:0;}
.switch .sl{position:absolute;inset:0;background:#26314d;border-radius:24px;transition:.25s;}
.switch .sl::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.25s;}
.switch input:checked + .sl{background:var(--gold);}
.switch input:checked + .sl::before{transform:translateX(20px);}

/* Toast 队列 */
#toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translateX(-50%);
  z-index:999;background:rgba(17,24,39,.95);color:#fff;padding:11px 20px;border-radius:22px;
  font-size:13px;font-weight:500;max-width:84vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4);
  transition:opacity .25s;pointer-events:none;}
#toast.hidden{opacity:0;}

/* 全屏特效层 */
.fx-layer{position:fixed;inset:0;z-index:900;pointer-events:none;overflow:hidden;}
.fx-shade{position:fixed;inset:0;z-index:800;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;}
.fx-shade .fx-card{background:#131c31;border:1px solid var(--dao);border-radius:18px;padding:26px 22px;text-align:center;max-width:82vw;}
.fx-shade .fx-t1{font-size:22px;font-weight:800;color:var(--dao);margin-bottom:8px;}
.fx-shade .fx-t2{font-size:14px;color:var(--text);margin-bottom:6px;}
.fx-shade .fx-t3{font-size:12px;color:var(--muted);}

/* 加载遮罩 */
#loadingMask{position:fixed;inset:0;z-index:950;background:rgba(11,17,32,.6);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;}
#loadingMask.hidden{display:none;}
.spinner{width:36px;height:36px;border:3px solid #26314d;border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* 粒子 */
.particle{position:absolute;border-radius:50%;pointer-events:none;animation:floatUp linear forwards;}
@keyframes floatUp{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-120px);opacity:0}}

/* 突破光环 */
.break-ring{position:fixed;left:50%;top:45%;width:60vmin;height:60vmin;transform:translate(-50%,-50%);
  border:3px solid var(--dao);border-radius:50%;z-index:910;pointer-events:none;opacity:0;}
.break-ring.show{animation:ringExpand 1.6s ease-out forwards;}
@keyframes ringExpand{0%{width:10vmin;height:10vmin;opacity:1}100%{width:80vmin;height:80vmin;opacity:0}}

/* 瓶颈灰罩 */
.bottleneck-shade{position:fixed;inset:0;z-index:880;background:rgba(80,80,90,.28);display:flex;align-items:center;justify-content:center;}
.bottleneck-shade .bn-card{background:#1a2030;border:1px solid #4b5563;border-radius:18px;padding:26px 22px;text-align:center;max-width:84vw;}
.bn-t1{font-size:20px;font-weight:800;color:#9ca3af;margin-bottom:10px;}
.bn-t2{font-size:13px;color:#cbd5e1;line-height:1.7;text-align:left;}

/* 动画关闭时全局禁用粒子 */
.no-fx .particle,.no-fx .fx-layer,.no-fx .break-ring{display:none !important;}

/* 弹窗（系统说明） */
.modal{position:fixed;inset:0;z-index:800;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;}
.modal.hidden{display:none;}
.modal-card{background:var(--card);border-radius:20px 20px 0 0;padding:20px 18px calc(24px + var(--safe-b));max-width:430px;width:100%;max-height:75vh;overflow-y:auto;}
.modal-card h3{margin:0 0 12px;font-size:17px;}
.modal-card p{font-size:13px;color:#b6c6dc;line-height:1.8;margin:6px 0;}
.modal-card .close{width:100%;margin-top:14px;border:0;background:var(--card2);color:var(--text);border-radius:12px;padding:12px;font-size:14px;font-weight:600;}

/* 身体数据编辑弹窗 */
.form-field{margin-bottom:12px;}
.form-field label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px;}
.form-field input{width:100%;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:10px;padding:11px;font-size:15px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-actions{display:flex;gap:10px;margin-top:8px;}
.form-actions .btn{flex:1;}

.empty-tip{text-align:center;color:var(--muted);font-size:13px;padding:30px 0;}
</style>
</head>

<script>

function ensureXian(){
  if(!state.xianJian){
    state.xianJian = {
      realm:0, layer:1, dao:'tian',
      main:[],           // 主修功法id 最多3
      skills:{},         // skillId -> {exp:0,lv:1}
      body:{arm:'', thigh:''},  // APP 缺臂围/大腿围，此处补录
      lastBreakAt:0,
      bottleneckDays:0
    };
  }
  xian = state.xianJian;
  // 初始化功法经验结构
  CONFIG.SKILLS.forEach(function(s){
    if(!xian.skills[s.id]) xian.skills[s.id] = {exp:0, lv:1};
  });
}
/* 数值校验：过滤负数/空/NaN */
function num(v, def){
  var n = +v;
  if(v === null || v === undefined || v === '' || !isFinite(n) || n < 0) return def;
  return n;
}

/* ============================================================
   FFMI 灵根计算模块（公式完全照搬文档）
   ============================================================ */
function getProfile(){
  return state.profile || {};
}
function getBodyLatest(){
  var log = state.bodyLog || [];
  return log.length ? log[log.length-1] : null;
}
function computeFFMI(){
  var p = getProfile();
  var b = getBodyLatest() || {};
  var h = num(p.height, 0);       // 身高 cm
  var w = num(b.weight, 0) || num(p.weight, 0);  // 空腹体重
  var waist = num(b.waist, 0);
  var arm = num(xian.body.arm, 0) || num(b.arm, 0);
  var thigh = num(xian.body.thigh, 0) || num(b.thigh, 0);
  var chest = num(b.chest, 0);
  if(!h || !w) return null;   // 缺身高体重无法算
  // 预估体脂率 ≈ 0.75 × (腰围/身高×100) − (臂围+大腿围)/身高 × 8
  var estFat = 0.75 * (waist/h*100) - (arm+thigh)/h * 8;
  estFat = Math.max(2, Math.min(45, estFat/100)); // 转小数并限幅
  // LBM = 空腹体重 × (1 − 预估体脂率)
  var lbm = w * (1 - estFat);
  // FFMI = 瘦体重 ÷ (身高米数)²
  var hm = h/100;
  var ffmi = lbm / (hm*hm);
  return {ffmi:ffmi, estFat:estFat, weight:w, height:h, waist:waist, arm:arm, thigh:thigh, chest:chest, hasBody: !!(waist||arm||thigh||chest)};
}
function getRoot(){
  var r = computeFFMI();
  if(!r) return {name:'未测算', mult:1.0, color:'#9ca3af', fx:'', up:'请完善身高体重数据', debuffs:[]};
  var idx = 0;
  for(var i=0;i<CONFIG.ROOTS.length;i++) if(r.ffmi > CONFIG.ROOTS[i].max) idx = i+1;
  if(idx >= CONFIG.ROOTS.length) idx = CONFIG.ROOTS.length-1;
  var root = CONFIG.ROOTS[idx];
  var mult = root.mult;
  var debuffs = [];
  // DEBUFF：肉身枯萎
  if(r.ffmi < CONFIG.DEBUFF_WEAK.ffmi){ mult *= CONFIG.DEBUFF_WEAK.mult; debuffs.push({name:'肉身枯萎', color:'#6b7280', msg:CONFIG.DEBUFF_WEAK.msg}); }
  // DEBUFF：浊脂淤灵（降一档）
  if(r.estFat*100 > CONFIG.DEBUFF_FAT.bodyFat){
    var tmpIdx = Math.max(0, idx-1);
    mult = CONFIG.ROOTS[tmpIdx].mult;
    debuffs.push({name:'浊脂淤灵', color:'#a8a29e', msg:CONFIG.DEBUFF_FAT.msg});
  }
  return {name:root.name, mult:mult, color:CONFIG.ROOT_COLOR[root.name]||'#9ca3af',
    fx:root.fx, up:root.up, debuffs:debuffs, ffmi:r.ffmi, rawRoot:root.name};
}

/* ============================================================
   修为结算模块（公式照搬：负重×次数×灵根倍率×主修1.2）
   ============================================================ */
function skillOfApp(appName){
  for(var i=0;i<CONFIG.SKILLS.length;i++){
    if(CONFIG.SKILLS[i].app === appName) return CONFIG.SKILLS[i];
  }
  return null;
}
function skillLevel(skillId){
  var s = xian.skills[skillId] || {exp:0, lv:1};
  return s;
}
function skillBonus(skillId){
  var s = skillLevel(skillId);
  var lvCfg = CONFIG.SKILL_LV[Math.min(s.lv, CONFIG.SKILL_LV.length)-1];
  return lvCfg ? lvCfg.bonus : 0;
}
/* 等效力量：该功法对应动作 历史最大负重 × 系数 × (1+功法等级加成) */
function effForce(skill){
  var maxW = 0;
  (state.workouts||[]).forEach(function(w){
    (w.items||[]).forEach(function(it){
      if(it.name !== skill.app) return;
      (it.sets||[]).forEach(function(s){
        var wt = num(s.weight, 0);
        if(wt > maxW) maxW = wt;
      });
    });
  });
  return maxW * skill.coeff * (1 + skillBonus(skill.id));
}
/* 道途等效力量 */
function daoForce(dao){
  var total = 0;
  CONFIG.SKILLS.forEach(function(s){
    if(s.dao === dao) total += effForce(s);
  });
  return total;
}
/* 五围达标 */
function bodyMet(realmIdx){
  var r = computeFFMI();
  if(!r || !r.hasBody) return false;
  var std = CONFIG.REALMS[realmIdx].body;
  var met = {
    weight: r.weight >= std.weight,
    chest: r.chest >= std.chest,
    arm: r.arm >= std.arm,
    waist: (r.waist > 0 && r.waist <= std.waist),
    thigh: r.thigh >= std.thigh
  };
  return met.weight && met.chest && met.arm && met.waist && met.thigh;
}
/* 力量达标（按当前道途） */
function forceMet(realmIdx){
  var dao = CONFIG.DAOS[xian.dao];
  var std = CONFIG.REALMS[realmIdx].str;
  var push = daoForce('tian'), pull = daoForce('xuan'), leg = daoForce('houtu');
  var val;
  if(dao.check === 'push'){ val = push >= std.push; }
  else if(dao.check === 'pull'){ val = pull >= std.pull; }
  else if(dao.check === 'leg'){ val = leg >= std.leg; }
  else { val = push >= std.push && pull >= std.pull && leg >= std.leg; }
  return val;
}
/* 结算单条训练 */
function settleWorkout(w, mult){
  var gained = {};
  (w.items||[]).forEach(function(it){
    var sk = skillOfApp(it.name);
    if(!sk) return;
    var totalW = 0, totalR = 0;
    (it.sets||[]).forEach(function(s){
      totalW += num(s.weight, 0);
      totalR += num(s.reps, 0);
    });
    if(totalW <= 0 || totalR <= 0) return;
    var isMain = xian.main.indexOf(sk.id) !== -1;
    var base = totalW * totalR * mult * (isMain ? (1+CONFIG.MAIN_BONUS) : 1);
    /* 顿悟 5% 概率 修为×2 */
    var dunwu = Math.random() < 0.05;
    var exp = Math.round(base * (dunwu ? 2 : 1));
    gained[sk.id] = {exp: exp, dunwu: dunwu, main: isMain};
  });
  return gained;
}
/* 应用修为到功法 + 升级判定 */
function applyExp(gained){
  var lvlUps = [];
  Object.keys(gained).forEach(function(id){
    var g = gained[id];
    var s = xian.skills[id];
    s.exp += g.exp;
    /* 升级判定 */
    var cur = CONFIG.SKILL_LV[Math.min(s.lv, CONFIG.SKILL_LV.length)-1];
    var next = CONFIG.SKILL_LV[s.lv]; // lv 1-based，next=索引s.lv
    if(next && s.exp >= next.need && s.lv < 9){
      s.lv = next.lv;
      lvlUps.push({id:id, cfg:next, name:CONFIG.SKILLS.filter(function(x){return x.id===id;})[0].name});
    }
    /* Toast */
    var msg = g.main ? CONFIG.TOAST.main.replace('{expAmount}', g.exp) : CONFIG.TOAST.normal.replace('{expAmount}', g.exp);
    if(g.dunwu){
      var skName = CONFIG.SKILLS.filter(function(x){return x.id===id;})[0].name;
      msg = CONFIG.TOAST.dunwu.replace('{skillName}', skName).replace('{expAmount}', g.exp);
    }
    toastQ(msg);
  });
  return lvlUps;
}

/* ============================================================
   境界突破模块（双条件：力量 + 五围）
   ============================================================ */
function checkBreak(){
  var realm = xian.realm;
  var layer = xian.layer;
  var std = CONFIG.REALMS[realm];
  var next = CONFIG.REALMS[realm+1];
  if(!next) return null;  // 已到渡劫
  var fMet = forceMet(realm+1);
  var bMet = bodyMet(realm+1);
  if(layer >= 9){
    /* 9层满：达标则突破，未达标则瓶颈 */
    if(fMet && bMet){
      xian.realm = realm+1;
      xian.layer = 1;
      xian.bottleneckDays = 0;
      return {break:true, realm:next};
    } else {
      xian.bottleneckDays++;
      return {bottleneck:true, realm:std, fMet:fMet, bMet:bMet};
    }
  } else {
    if(fMet && bMet){
      xian.layer++;
      return {layerUp:true, realm:std, layer:xian.layer};
    }
  }
  return null;
}

/* ============================================================
   动画控制器（动画锁 + 粒子开关）
   ============================================================ */
function spawnParticles(color, count){
  if(!fxEnabled || animRunning) return;
  var layer = document.getElementById('fxLayer');
  if(!layer){ layer = document.createElement('div'); layer.className='fx-layer'; layer.id='fxLayer'; document.body.appendChild(layer); }
  for(var i=0;i<count;i++){
    var p = document.createElement('div');
    p.className='particle';
    var size = 4 + Math.random()*6;
    p.style.cssText = 'width:'+size+'px;height:'+size+'px;background:'+(color||CONFIG.DAOS[xian.dao].color)+';'+
      'left:'+(Math.random()*100)+'%;top:'+(50+Math.random()*40)+'%;animation-duration:'+(1+Math.random())+'s;opacity:'+(0.5+Math.random()*0.5);
    layer.appendChild(p);
    setTimeout(function(el){ el && el.remove(); }, 2200);
  }
}
function lockAnimation(ms){
  animRunning = true;
  setTimeout(function(){ animRunning = false; }, ms || 1600);
}
function showShade(title, sub, foot, color, ms){
  lockAnimation(ms || 2000);
  var sh = document.createElement('div');
  sh.className='fx-shade';
  sh.style.borderColor = color || CONFIG.DAOS[xian.dao].color;
  sh.innerHTML = '<div class="fx-card" style="border-color:'+(color||CONFIG.DAOS[xian.dao].color)+';">'+
    '<div class="fx-t1" style="color:'+(color||CONFIG.DAOS[xian.dao].color)+';">'+title+'</div>'+
    '<div class="fx-t2">'+(sub||'')+'</div><div class="fx-t3">'+(foot||'')+'</div></div>';
  document.body.appendChild(sh);
  if(fxEnabled){
    var ring = document.createElement('div');
    ring.className='break-ring'; ring.style.borderColor = color || CONFIG.DAOS[xian.dao].color;
    document.body.appendChild(ring);
    setTimeout(function(){ ring.classList.add('show'); }, 30);
    setTimeout(function(){ ring.remove(); }, 2000);
  }
  setTimeout(function(){ sh.remove(); }, ms || 2000);
}

/* ============================================================
   Toast 队列
   ============================================================ */
var toastQueue = [];
var toastBusy = false;
function toastQ(msg){
  toastQueue.push(msg);
  if(!toastBusy) nextToast();
}
function nextToast(){
  if(!toastQueue.length){ toastBusy=false; return; }
  toastBusy = true;
  var msg = toastQueue.shift();
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  setTimeout(function(){
    el.classList.add('hidden');
    setTimeout(nextToast, 250);
  }, 2300);
}

/* ============================================================
   UI 渲染模块
   ============================================================ */
function render(){
  var root = getRoot();
  var realm = CONFIG.REALMS[xian.realm];
  var dao = CONFIG.DAOS[xian.dao];
  var k = (num(getProfile().height, 0) || CONFIG.BASE_HEIGHT) / CONFIG.BASE_HEIGHT;
  document.documentElement.style.setProperty('--dao', dao.color);

  /* 顶部 */
  var realmLayer = xian.layer;
  var nextRealm = CONFIG.REALMS[xian.realm+1];
  var prog = nextRealm ? (realmLayer-1)/8*100 : 100;
  document.getElementById('realmStrip').innerHTML =
    '<div class="realm-ic">'+realmIcon(xian.realm)+'</div>'+
    '<div class="realm-info">'+
      '<div class="realm-name">'+realm.name+' · '+layerCn(realmLayer)+'</div>'+
      '<div class="realm-sub">'+
        '<span>道途：'+dao.name+'</span>'+
        '<span>灵根：'+root.name+'（×'+root.mult.toFixed(2)+'）</span>'+
      '</div>'+
      '<div class="realm-prog"><div class="realm-prog-fill" style="width:'+prog+'%;background:'+dao.color+'"></div></div>'+
      '<div class="realm-prog-txt">'+(nextRealm?('距下一境 '+nextRealm.name+' 还需力量达标 & 五围达标'):'已达肉身巅峰')+'</div>'+
    '</div>';

  var ffmiTxt = 'FFMI：--';
  var cr = computeFFMI();
  if(cr) ffmiTxt = 'FFMI：'+cr.ffmi.toFixed(1);
  var dbg = (root.debuffs||[]).map(function(d){ return '<span class="debuff-tag">'+d.name+'</span>'; }).join('');
  document.getElementById('rootStrip').innerHTML =
    '<span class="root-badge" style="background:'+root.color+'22;color:'+root.color+';">'+root.name+'</span>'+
    '<span class="root-ffmi">'+ffmiTxt+'</span>'+dbg;

  /* 道途卡 */
  var daoHtml = '';
  Object.keys(CONFIG.DAOS).forEach(function(kk){
    var d = CONFIG.DAOS[kk];
    var unlocked = kk!=='hunyuan' || xian.realm >= 4; // 元婴=index4
    var active = xian.dao===kk;
    daoHtml += '<div class="dao-card '+(active?'active':'')+'" data-dao="'+kk+'" style="'+(active?'border-color:'+d.color+';':'')+'">'+
      '<div class="dc-ic" style="'+(active?'filter:drop-shadow(0 0 6px '+d.color+');':'')+'">'+daoIcon(kk)+'</div>'+
      '<div class="dc-name" style="color:'+(active?d.color:'' )+'">'+d.name+'</div>'+
      '<div class="dc-val">'+(kk==='hunyuan'?(unlocked?'已解锁':'元婴解锁'):'突破校验')+'</div>'+
      (kk==='hunyuan'&&!unlocked?'<div style="font-size:9px;color:var(--muted);">未解锁</div>':'')+
    '</div>';
  });
  document.getElementById('daoGrid').innerHTML = daoHtml;

  /* 三系功法 */
  var html = '';
  ['tian','xuan','houtu'].forEach(function(daoKey){
    var daoName = CONFIG.DAOS[daoKey].name;
    var daoColor = CONFIG.DAOS[daoKey].color;
    var list = CONFIG.SKILLS.filter(function(s){return s.dao===daoKey;});
    list.forEach(function(sk){
      var lv = skillLevel(sk.id);
      var lvCfg = CONFIG.SKILL_LV[Math.min(lv.lv, CONFIG.SKILL_LV.length)-1];
      var need = lvCfg.need;
      var nextLv = CONFIG.SKILL_LV[Math.min(lv.lv, CONFIG.SKILL_LV.length-1)+1];
      var nextNeed = nextLv ? nextLv.need : need;
      var pct = nextNeed>need ? Math.min(100, Math.round((lv.exp-need)/(nextNeed-need)*100)) : 100;
      var isMain = xian.main.indexOf(sk.id)!==-1;
      html += '<div class="skill-card">'+
        '<div class="skill-head">'+
          '<div class="skill-ic" style="border:1px solid '+daoColor+'44;">'+sk.icon+
            '<span class="lv-badge">Lv'+lv.lv+'</span></div>'+
          '<div class="skill-info">'+
            '<div class="skill-name">《'+sk.name+'》 <span style="font-size:10px;color:'+daoColor+';">'+lvCfg.name+'</span></div>'+
            '<div class="skill-meta">'+sk.app+' · 系数×'+sk.coeff+' · 加成+'+(lvCfg.bonus*100)+'%</div>'+
            '<div class="skill-exp"><div class="skill-exp-fill" style="width:'+pct+'%;background:'+daoColor+';"></div></div>'+
            '<div class="skill-exp-txt"><span>修为 '+Math.round(lv.exp)+'</span><span>'+((nextLv?nextLv.name:'圆满'))+' '+(nextLv?nextLv.need:'—')+'</span></div>'+
          '</div>'+
          '<button class="main-btn '+(isMain?'on':'')+'" data-main="'+sk.id+'">'+(isMain?'主修✓':'设主修')+'</button>'+
        '</div>'+
        '<div class="skill-effect">✨ 训练特效：'+sk.fx+'</div>'+
      '</div>';
    });
  });
  document.getElementById('skillsWrap').innerHTML = html;

  /* 肉身档案 */
  var cr2 = computeFFMI();
  var bGrid = '';
  var p = getProfile();
  var b = getBodyLatest() || {};
  var cells = [
    {k:'身高', n:p.height||'--', u:'cm'},
    {k:'体重', n:cr2?cr2.weight:'--', u:'kg'},
    {k:'胸围', n:num(b.chest,0)||'--', u:'cm'},
    {k:'腰围', n:num(b.waist,0)||'--', u:'cm'},
    {k:'臂围', n:num(xian.body.arm,0)||num(b.arm,0)||'--', u:'cm'},
    {k:'大腿围', n:num(xian.body.thigh,0)||num(b.thigh,0)||'--', u:'cm'}
  ];
  cells.forEach(function(c){
    bGrid += '<div class="bd-cell"><div class="k">'+c.k+'</div><div class="n">'+c.n+'<span class="u"> '+c.u+'</span></div></div>';
  });
  document.getElementById('bodyGrid').innerHTML = bGrid;

  /* 系统说明卡 */
  document.getElementById('helpCard').innerHTML = CONFIG.HELP.replace(/\n/g,'<br>');
}

function realmIcon(r){
  return ['🌱','💨','🪨','✨','👶','🔥','⚡','👑','🐉','🌩️'][r] || '🌱';
}
function daoIcon(d){
  return {tian:'🖐️', xuan:'🐲', houtu:'⛰️', hunyuan:'☯️'}[d] || '☯️';
}
function layerCn(n){
  return ['一','二','三','四','五','六','七','八','九'][n-1] || n;
}

/* ============================================================
   交互事件模块（300ms 防抖 + 动画锁）
   ============================================================ */
var lastClick = {};
function debounce(key, fn){
  var now = Date.now();
  if(lastClick[key] && now - lastClick[key] < 300) return;
  lastClick[key] = now;
  fn();
}
/* 显示加载遮罩 */
function showLoading(txt){
  document.getElementById('loadingTxt').textContent = txt || CONFIG.TOAST.loading;
  document.getElementById('loadingMask').classList.remove('hidden');
}
function hideLoading(){ document.getElementById('loadingMask').classList.add('hidden'); }

/* 同步修为 */
function syncAll(){
  debounce('sync', function(){
    if(animRunning){ toastQ('动画播放中，请稍候'); return; }
    if(!state || !state.workouts || !state.workouts.length){ toastQ(CONFIG.TOAST.noNew); return; }
    var root = getRoot();
    if(!computeFFMI() || !root.ffmi){ toastQ(CONFIG.TOAST.noBody); return; }
    showLoading();
    setTimeout(function(){
      var pending = (state.workouts||[]).filter(function(w){ return !w.cultivationSettled; });
      if(!pending.length){
        hideLoading();
        toastQ(CONFIG.TOAST.noNew);
        render();
        return;
      }
      pending.forEach(function(w){
        var g = settleWorkout(w, root.mult);
        applyExp(g);
        w.cultivationSettled = true;   // ★ 防重复结算标记
      });
      save();
      hideLoading();
      /* 突破判定 */
      var brk = checkBreak();
      if(brk && brk.break){
        showShade('✨ 突破！'+brk.realm.name, brk.realm.sub, brk.realm.foot, CONFIG.DAOS[xian.dao].color, 2400);
        spawnParticles(CONFIG.DAOS[xian.dao].color, 40);
      } else if(brk && brk.bottleneck){
        showBottleneck(brk);
      } else if(brk && brk.layerUp){
        spawnParticles(CONFIG.DAOS[xian.dao].color, 25);
        toastQ('修为精进！'+brk.realm.name+' · '+layerCn(brk.layer)+'层');
      }
      toastQ(CONFIG.TOAST.syncDone);
      render();
    }, 120);
  });
}
function showBottleneck(brk){
  lockAnimation(2000);
  var sh = document.createElement('div');
  sh.className='bottleneck-shade';
  sh.innerHTML = '<div class="bn-card"><div class="bn-t1">🔒 境界桎梏</div>'+
    '<div class="bn-t2">'+CONFIG.BOTTLENECK.replace('{realmName}', brk.realm.name).replace(/\n/g,'<br>')+
    '</div><div style="margin-top:12px;display:flex;gap:8px;">'+
    '<div style="flex:1;font-size:11px;color:#9ca3af;text-align:center;">力量'+(brk.fMet?'✓':'✗')+'</div>'+
    '<div style="flex:1;font-size:11px;color:#9ca3af;text-align:center;">五围'+(brk.bMet?'✓':'✗')+'</div>'+
    '</div></div>';
  document.body.appendChild(sh);
  setTimeout(function(){ sh.remove(); }, 2400);
}

/* 道途切换 */
function switchDao(dao){
  debounce('dao', function(){
    if(animRunning){ toastQ('动画播放中，请稍候'); return; }
    if(dao === 'hunyuan' && xian.realm < 4){
      toastQ(CONFIG.DAOS.hunyuan.unlock);
      toastQ('当前境界暂未解锁混元道，稳步修炼至元婴境即可开启。');
      return;
    }
    xian.dao = dao;
    save();
    spawnParticles(CONFIG.DAOS[dao].color, 20);
    toastQ('道途更迭，调整修炼侧重，稳步打磨属于你的肉身！');
    toastQ(CONFIG.DAOS[dao].unlock);
    render();
  });
}

/* 主修切换 */
function toggleMain(skillId){
  debounce('main', function(){
    var idx = xian.main.indexOf(skillId);
    var sk = CONFIG.SKILLS.filter(function(x){return x.id===skillId;})[0];
    if(idx !== -1){
      xian.main.splice(idx,1);
      save(); render();
      toastQ(CONFIG.MAIN_MSG_OFF.replace('{skillName}', sk.name));
    } else {
      if(xian.main.length >= CONFIG.MAIN_MAX){ toastQ(CONFIG.MAIN_MSG_LIMIT); return; }
      xian.main.push(skillId);
      save(); render();
      toastQ(CONFIG.MAIN_MSG_ON.replace('{skillName}', sk.name));
    }
  });
}

/* 身体数据编辑弹窗 */
function openBodyEditor(){
  if(animRunning){ toastQ('动画播放中，请稍候'); return; }
  var p = getProfile();
  var b = getBodyLatest() || {};
  var m = document.createElement('div');
  m.className='modal';
  m.innerHTML = '<div class="modal-card">'+
    '<h3>🧬 修改身体数据</h3>'+
    '<div class="form-field"><label>身高 cm（基准184自适应）</label><input id="edHeight" type="number" step="0.1" value="'+(p.height||'')+'"/></div>'+
    '<div class="form-field"><label>空腹体重 kg</label><input id="edWeight" type="number" step="0.1" value="'+(num(b.weight,0)||num(p.weight,0)||'')+'"/></div>'+
    '<div class="form-grid">'+
      '<div class="form-field"><label>胸围 cm</label><input id="edChest" type="number" step="0.1" value="'+(num(b.chest,0)||'')+'"/></div>'+
      '<div class="form-field"><label>空腹腰围 cm</label><input id="edWaist" type="number" step="0.1" value="'+(num(b.waist,0)||'')+'"/></div>'+
      '<div class="form-field"><label>放松臂围 cm</label><input id="edArm" type="number" step="0.1" value="'+(num(xian.body.arm,0)||num(b.arm,0)||'')+'"/></div>'+
      '<div class="form-field"><label>大腿围 cm</label><input id="edThigh" type="number" step="0.1" value="'+(num(xian.body.thigh,0)||num(b.thigh,0)||'')+'"/></div>'+
    '</div>'+
    '<div class="form-actions"><button class="btn ghost" data-act="bodyCancel">取消</button>'+
    '<button class="btn primary" data-act="bodySave">保存</button></div>'+
  '</div>';
  document.body.appendChild(m);
  m.addEventListener('click', function(e){
    if(e.target.dataset.act==='bodyCancel') m.remove();
    if(e.target.dataset.act==='bodySave'){
      var h = num(document.getElementById('edHeight').value, 0);
      var w = num(document.getElementById('edWeight').value, 0);
      var chest = num(document.getElementById('edChest').value, 0);
      var waist = num(document.getElementById('edWaist').value, 0);
      var arm = num(document.getElementById('edArm').value, 0);
      var thigh = num(document.getElementById('edThigh').value, 0);
      /* 数值校验 */
      if(h<=0 || w<=0){ toastQ(CONFIG.TOAST.badVal); return; }
      state.profile = state.profile || {};
      state.profile.height = h;
      if(!state.bodyLog) state.bodyLog = [];
      var today = new Date();
      var ds = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
      var entry = {date:ds, weight:w, bodyFat:'', bmr:'', chest:chest||'', waist:waist||'', hip:'', skeletal:'', visceral:''};
      var idx = state.bodyLog.findIndex(function(x){return x.date===ds;});
      if(idx>=0) state.bodyLog[idx] = Object.assign(state.bodyLog[idx], entry);
      else state.bodyLog.push(entry);
      xian.body.arm = arm; xian.body.thigh = thigh;
      save(); m.remove();
      /* 修改身体数据自动重算灵根 + 突破判定 */
      var root = getRoot();
      if(root && root.ffmi) toastQ('灵根已更新：'+root.name+'（FFMI '+root.ffmi.toFixed(1)+'）');
      var brk = checkBreak();
      if(brk && brk.break) showShade('✨ 突破！'+brk.realm.name, brk.realm.sub, brk.realm.foot, CONFIG.DAOS[xian.dao].color, 2200);
      render();
    }
  });
}

/* 系统说明 */
function openHelp(){
  if(animRunning){ toastQ('动画播放中，请稍候'); return; }
  var m = document.createElement('div');
  m.className='modal';
  m.innerHTML = '<div class="modal-card"><h3>📖 健体修仙录 · 系统说明</h3>'+
    CONFIG.HELP.replace(/\n/g,'<br>')+
    '<button class="close" data-act="closeHelp">关闭</button></div>';

  m.addEventListener('click', function(e){ if(e.target.dataset.act==='closeHelp') m.remove(); });
}

document.getElementById('btnBack').addEventListener('click', function(){ history.length>1 ? history.back() : location.href='./index.html'; });

/* 初始化 */
(function init(){
  state = loadState();
  if(!state){
    /* 无数据时给个提示但不新建（不污染APP存储） */
    toastQ('未检测到训练数据，请先在 FitRecord 中记录训练');
    state = {profile:{height:175}, bodyLog:[], workouts:[], plans:[], folders:[], customEx:[]};
  }
  ensureXian();
  /* 道途默认跟随旧版 xian 数据（如有） */
  if(state.xian && state.xian.dao && CONFIG.DAOS[state.xian.dao]) xian.dao = state.xian.dao;
  render();
  /* 离线提示 */
  if(!navigator.onLine) toastQ(CONFIG.TOAST.offline);
  window.addEventListener('online', function(){ toastQ('网络已恢复，可点击同步训练修为'); });
})();
</script>
